name: release

# Signed releases. A tag matching v* builds every workspace wheel, signs
# the resulting artifacts with cosign keyless (GitHub OIDC -- no
# long-lived signing key in the repo), and attaches both the wheels and
# their signatures to the GitHub Release. Operators verify with
# `cosign verify-blob` as documented in docs/deploy.md; an unsigned
# wheel is not a release this project produces.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Build workspace wheels
        run: |
          mkdir -p dist
          for pkg in packages/*/; do
            uv build --wheel --out-dir dist "${pkg%/}"
          done
          uv build --wheel --out-dir dist eval

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign every wheel (keyless)
        run: |
          for wheel in dist/*.whl; do
            cosign sign-blob --yes --bundle "${wheel}.cosign.bundle" "${wheel}"
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.cosign.bundle
          generate_release_notes: true

      - name: Build and push the gateway image
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, push, and sign the gateway image
        env:
          IMAGE: ghcr.io/${{ github.repository }}/agentshield-gateway
          TAG: ${{ github.ref_name }}
        run: |
          docker build -f packages/agentshield-gateway/Dockerfile -t "${IMAGE}:${TAG}" .
          docker push "${IMAGE}:${TAG}"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${TAG}")"
          cosign sign --yes "${digest}"
