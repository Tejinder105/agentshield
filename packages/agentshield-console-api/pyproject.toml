[project]
name = "agentshield-console-api"
version = "0.1.0"
description = "The control-plane HTTP API behind apps/console: policy editing and validation through monotonic confinement, the live approval queue (list, approve, deny, SSE), the audit explorer with provenance-path denial explanations and deterministic session replay, and the emergency kill switch. Deliberately does not depend on agentshield-gateway: it administers the same lower-level services (policy, approvals, ledger, revocation) the gateway's data path enforces against, rather than sitting on that data path itself."
requires-python = ">=3.11"
dependencies = [
    "agentshield-core",
    "agentshield-policy",
    "agentshield-confinement",
    "agentshield-approvals",
    "agentshield-ledger",
    "agentshield-revocation",
    "fastapi>=0.115",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentshield_console_api"]

[tool.uv.sources]
agentshield-core = { workspace = true }
agentshield-policy = { workspace = true }
agentshield-confinement = { workspace = true }
agentshield-approvals = { workspace = true }
agentshield-ledger = { workspace = true }
agentshield-revocation = { workspace = true }
