[project]
name = "agentshield-ledger"
version = "0.1.0"
description = "Tamper-evident audit ledger: hash chain, Merkle tree with signed checkpoints, external anchoring, and a zero-dependency offline verifier."
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43.0",
    "sqlalchemy[asyncio]>=2.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]

[project.scripts]
agentshield-verify = "agentshield_ledger.verify.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentshield_ledger"]
