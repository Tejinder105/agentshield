[project]
name = "agentshield-confinement"
version = "0.1.0"
description = "Monotonic confinement: LLM-synthesized initial policy plus a subsumption-gated update path where only proven narrowings auto-apply."
requires-python = ">=3.11"
dependencies = [
    "agentshield-core",
    "agentshield-policy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentshield_confinement"]

[tool.uv.sources]
agentshield-core = { workspace = true }
agentshield-policy = { workspace = true }
