[project]
name = "agentshield-sdk"
version = "0.1.0"
description = "In-process middleware for agent frameworks (OpenAI Agents SDK, LangChain): per-value label propagation and the dual-LLM quarantine, wired to the same agentshield-gateway decision pipeline the MCP proxy uses."
requires-python = ">=3.11"
dependencies = [
    "agentshield-core",
    "agentshield-gateway",
    "pydantic>=2.9",
]

[project.optional-dependencies]
openai-agents = ["openai-agents>=0.20"]
langchain = ["langchain-core>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentshield_sdk"]
