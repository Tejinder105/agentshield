[project]
name = "agentshield-policy"
version = "0.1.0"
description = "Cedar-backed, fail-closed Policy Decision Point with MCP schema generation and monotonic-confinement subsumption checking."
requires-python = ">=3.11"
dependencies = [
    "agentshield-core",
    "cedarpy>=4.12",
    "cedar-policy-mcp-schema-generator>=0.6.1",
    "z3-solver>=4.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentshield_policy"]

[tool.uv.sources]
agentshield-core = { workspace = true }
