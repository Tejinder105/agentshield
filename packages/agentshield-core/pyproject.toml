[project]
name = "agentshield-core"
version = "0.1.0"
description = "Agent Shield security kernel: label lattice, provenance, capabilities, Decision type, lethal-trifecta invariant."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.115",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentshield_core"]
