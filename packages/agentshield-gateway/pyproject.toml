[project]
name = "agentshield-gateway"
version = "0.1.0"
description = "The Agent Shield PEP: an MCP tools/call interceptor (FastAPI HTTP surface + mcp v2 server middleware) that runs the fixed-order, fail-closed decision pipeline before any tool dispatches."
requires-python = ">=3.11"
dependencies = [
    "agentshield-core",
    "agentshield-policy",
    "agentshield-ledger",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "mcp>=2.0",
    "pydantic>=2.9",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentshield_gateway"]
