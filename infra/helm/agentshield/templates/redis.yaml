{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentshield.fullname" . }}-redis
  labels:
    app.kubernetes.io/name: agentshield
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentshield
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentshield
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentshield.fullname" . }}-redis
spec:
  ports:
    - port: 6379
  selector:
    app.kubernetes.io/name: agentshield
    app.kubernetes.io/component: redis
{{- end }}
