replicaCount: 2

image:
  repository: ghcr.io/example/agentshield-gateway
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# Cosign-signed images only. Set to false only for a local kind/minikube
# bring-up that has not gone through the signed-release workflow.
verifySignatures: true

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1
    memory: 512Mi

# The application role must be INSERT/SELECT-only on the audit table.
# See infra/sql/001_audit_grants.sql and docs/deploy.md.
postgres:
  enabled: true
  image: postgres:16-alpine
  persistence:
    size: 20Gi
  auth:
    username: agentshield
    database: agentshield
    existingSecret: agentshield-postgres

redis:
  enabled: true
  image: redis:7-alpine

shadowMode: false

# Hosts the URL allowlist is restricted to. Empty means "URL allowlisting
# is not configured" -- secret-pattern scanning still runs.
egress:
  allowedHosts: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
